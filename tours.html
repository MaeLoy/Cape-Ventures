<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cape Town Tour Packages and Prices | Cape Ventures</title>
    <meta name="description" content="Browse Cape Ventures tour packages in Cape Town:
     Table Mountain, Cape Point, Robben Island and Penguin tours. Search, sort and view prices.">
     <meta name="keywords" content="Cape Town tour packages, Cape Town tour prices, Table Mountain, 
     Cape Point, Robben Island, penguins Boulders Beach">
     <meta name="authour" content="Megan Arigundia">
     <link rel="stylesheet" href="css/style.css">
</head>

<body>
 <header>
    <img src="images/cape-ventures-logo.jpg" alt="Cape Ventures logo" width="80">
    <h1>Cape Ventures</h1>
 </header>
<!--Main Navigation-->
 <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="tours.html">Tour Packages</a>
                <a href="enquiry.html">Booking</a>
                <a href="contact.html">Contact</a>
 </nav>
 <!--Main Page content-->
 <main> 
    <section>
        <h2>Our Tour Packages</h2>
        <p>
            Cape Ventures offers a variety of tours designed to help visitors explore the attractions, culture and natural beauty of Cape Town.
        </p>
    </section>
<!-- Search and sort controls that will be used by tours.js -->
 <section>
    <div class="controls">
        <div>
            <label for="tour-search">Search tours</label>
            <input type="search" id="tour-search" placeholder="e.g. island, penguins">
        </div>
    <div>
    <label for="tour-sort">Sort by</label>
    <select id="tour-sort">
        <option value="name">Name (A to Z)</option>
        <option value="price-asc">Price (low to high)</option>
        <option value="price-desc">Price (high to low)</option>
    </select>
    </div>
    </div>
    <p id="tour-count" aria-live="polite"></p>
    <!--The tour cards are created here by java script-->
    <div class="grid" id="tour-grid"></div>
 </section>
   
     <!-- Gallery: clicking a picture opens it larger in lightbox -->
      <section>
        <h2>Photo Gallery</h2>
        <div class="gallery grid grid-3">
            <a href="images/table-mountain-summit-view.jpg"><img src="images/table-mountain-summit-view-480.jpg"
            alt="Table Mountain viewed from below" loading="lazy"></a>

          <a href="images/cape-point-scenic-coastline.jpg"><img src="images/cape-point-scenic-coastline-480.jpg"
            alt="Scenic coastline at Cape Point" loading="lazy"></a>

         <a href="images/robben-island-museum.jpg"><img src="images/robben-island-museum-480.jpg"
            alt="Robben Island historic site and Museum" loading="lazy"></a>

        <a href="images/african-penguins-cape-town.jpg"><img src="images/african-penguins-cape-town-480.jpg"
            alt="African penguins at Boulders Beach" loading="lazy"></a>
        </div>
      </section>

      <!--Lightbox: The pop-up window that shows the larger picture-->
      <dialog id="lightbox" aria-label="Image viewer">
        <button type="button" class="close" aria-label="Close image">&times;</button>
        <figure>
            <img src="" alt="">
            <figcaption></figcaption>
        </figure>
        <div class="lb-buttons">
            <button type="button" class="prev">Previous</button>
            <button type="button" class="next">Next</button>
        </div>
      </dialog>



 </main>

 <!--Footer Information-->
 <footer>
    <p>&copy; 2022 Cape Ventures</p>
 </footer>
 <script src="js/main.js" defer></script>
 <script src="js/tours.js" defer></script>
 </body>
 </html>
